name: Documentation or prompt defect
description: Report an incorrect, unclear, broken or unsafe part of the playbook.
title: "[Defect]: "
labels: ["type: defect"]
body:
  - type: markdown
    attributes:
      value: |
        Report only issues that can be described safely in a public repository. Do not include proprietary code, internal URLs, credentials, real customer data or confidential architecture.
  - type: input
    id: location
    attributes:
      label: Affected file or section
      description: Link to the guide, prompt, template or repository file.
      placeholder: guides/05-parity-and-testing.md
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is incorrect or unclear?
      description: Explain the defect using sanitized, synthetic examples.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Suggested correction
      description: What should the playbook say or do instead?
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Minor wording or navigation issue
        - Could lead to an incomplete implementation
        - Could create a regression or compatibility risk
        - Could create a security, data-integrity or deployment risk
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Public information check
      options:
        - label: I have not included secrets, personal data, proprietary code or confidential project information.
          required: true
