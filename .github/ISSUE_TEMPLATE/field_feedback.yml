name: Experience report / feedback
description: Share a sanitized account of trying the playbook.
title: "[Feedback]: "
labels: ["type: feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Feedback is valuable even when an approach did not work. Keep project, employer, client, system and data details anonymous. Do not attach source code or internal documents.
  - type: dropdown
    id: stage
    attributes:
      label: Stage tried
      options:
        - Preflight and repository safety
        - Assessment and responsibility discovery
        - Architecture decision and planning
        - Contract-first skeleton / parity harness
        - Pilot vertical slice
        - Dependency modernization
        - Final validation / DEV readiness
        - Multi-API rollout
        - Not tried yet
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Outcome
      options:
        - Worked as expected
        - Worked with adaptation
        - Partially worked
        - Did not work
        - Still evaluating
    validations:
      required: true
  - type: textarea
    id: what_worked
    attributes:
      label: What worked well?
      description: Which instructions, gates or templates helped?
  - type: textarea
    id: friction
    attributes:
      label: What was difficult or missing?
      description: Describe friction, ambiguity, missing checks or false assumptions.
  - type: textarea
    id: suggested
    attributes:
      label: What would you change?
      description: Suggest an improvement or a reusable lesson.
  - type: input
    id: context
    attributes:
      label: Sanitized context (optional)
      description: For example, API size, test framework, hosting style or broad integration types. Do not identify an employer/client.
  - type: checkboxes
    id: safety
    attributes:
      label: Public information check
      options:
        - label: I have not included secrets, personal data, proprietary code or confidential project information.
          required: true
